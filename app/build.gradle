plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sharaai.ukhane'
    compileSdk 36

    defaultConfig {
        applicationId "com.sharaai.ukhane"
        minSdk 21
        targetSdk 36
        versionCode 1011
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // support multiple res directories for screen density layouts
    sourceSets {
        main {
            res.srcDirs = [
                'src/main/res',
                'src/main/res-normal',
                'src/main/res-small',
                'src/main/res-w360dp',
                'src/main/res-w480dp',
                'src/main/res-w600dp',
                'src/main/res-w700dp',
            ]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.core:core:1.12.0'
    // AdMob — replace YOUR_APP_ID in AndroidManifest before publishing
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
